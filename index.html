<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下一站去哪儿？- 智能旅行规划</title>
<style>
:root {
  --bg: #f7f5f0; --card: #fff; --text: #2d2d2d; --sub: #7a7a7a; --border: #e8e6dc;
  --yn: #e8633a; --yn-light: #fdf2ed; --yn-dark: #c44a28;
  --gz: #2d8a6e; --gz-light: #edf7f2; --gz-dark: #1a6b52;
  --gold: #f0a030; --eco: #2d8a6e; --premium: #e8633a;
  --radius: 22px; --radius-sm: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 6px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 14px 48px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.container{width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center}

.header{text-align:center;margin:20px 0 28px}
.header h1{
  font-size:1.8rem;font-weight:800;letter-spacing:-0.03em;
  background:linear-gradient(135deg,var(--yn),var(--gz));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header p{color:var(--sub);font-size:0.9rem;margin-top:6px}

.spin-btn{
  display:flex;align-items:center;gap:10px;
  padding:18px 48px;border-radius:60px;border:none;cursor:pointer;
  font-size:1.15rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#ff6b4a,#e8633a);
  box-shadow:0 6px 28px rgba(232,99,58,0.38);
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  margin-bottom:32px;letter-spacing:0.03em;
  position:relative;overflow:hidden;
}
.spin-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent)}
.spin-btn:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(232,99,58,0.5)}
.spin-btn:active{transform:scale(0.96)}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
.spin-btn .btn-icon{font-size:1.6rem;display:inline-block}
@keyframes diceRoll{
  0%{transform:rotateY(0) scale(1)} 25%{transform:rotateY(180deg) scale(0.8)}
  50%{transform:rotateY(360deg) scale(1.1)} 75%{transform:rotateY(540deg) scale(0.9)}
  100%{transform:rotateY(720deg) scale(1)}
}
.spin-btn.spinning .btn-icon{animation:diceRoll 0.9s ease-out}

.slot-area{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;margin-bottom:28px
}
.slot-card{
  flex:1 1 180px;max-width:260px;min-width:150px;
  background:var(--card);border-radius:var(--radius);padding:24px 18px;
  text-align:center;border:2px solid var(--border);
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);cursor:default;position:relative;
}
.slot-card .slot-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--sub);margin-bottom:8px;font-weight:700}
.slot-card .slot-value{font-size:1.4rem;font-weight:800;margin-bottom:4px;transition:all 0.2s}
.slot-card .slot-emoji{font-size:2.2rem;display:block;margin-bottom:6px}
@keyframes slotShake{
  0%,100%{transform:translateY(0)} 15%{transform:translateY(-6px)} 30%{transform:translateY(6px)}
  45%{transform:translateY(-3px)} 60%{transform:translateY(3px)} 75%{transform:translateY(-1px)}
}
.slot-card.shaking{animation:slotShake 0.6s ease-in-out}

.result-card{
  background:var(--card);border-radius:var(--radius);padding:0;
  width:100%;box-shadow:var(--shadow-md);border:1px solid var(--border);
  overflow:hidden;animation:fadeSlideIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
  margin-bottom:20px;
}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)}
}
.result-banner{
  padding:22px 24px;display:flex;align-items:center;gap:14px;color:#fff;
}
.result-banner.yn-bg{background:linear-gradient(135deg,#e8633a,#d44a2a)}
.result-banner.gz-bg{background:linear-gradient(135deg,#2d8a6e,#1a6b52)}
.result-banner .rb-icon{font-size:2.6rem}
.result-banner .rb-info h2{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em}
.result-banner .rb-info .rb-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.rb-tag{font-size:0.72rem;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);font-weight:600}
.result-body{padding:24px}

/* Tab switcher */
.tab-switcher{
  display:flex;gap:0;margin-bottom:20px;background:#f0ede6;border-radius:var(--radius-sm);padding:4px;
}
.tab-btn{
  flex:1;padding:12px;border:none;cursor:pointer;font-size:0.9rem;font-weight:700;
  border-radius:12px;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  background:transparent;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab-btn.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.tab-btn.eco-tab.active{color:var(--eco)}
.tab-btn.premium-tab.active{color:var(--premium)}
.tab-content{display:none}
.tab-content.active{display:block}

.section-title{
  font-size:0.78rem;font-weight:800;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--sub);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.transport-bar{
  display:flex;align-items:center;gap:12px;background:#fafaf8;
  border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:20px;border:1px solid var(--border);
}
.transport-bar .tb-icon{font-size:1.8rem}
.transport-bar .tb-details h4{font-size:0.9rem;font-weight:700;margin-bottom:3px}
.transport-bar .tb-details p{font-size:0.78rem;color:var(--sub)}

.attr-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:10px;margin-bottom:20px;
}
.attr-item{
  background:#fafaf8;border-radius:var(--radius-sm);padding:12px;
  border:1px solid var(--border);transition:all 0.2s;
}
.attr-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:#ccc}
.attr-rank{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:0.65rem;font-weight:800;color:#fff;margin-bottom:6px;
}
.attr-rank.r1{background:linear-gradient(135deg,#f5a623,#e8961a)}
.attr-rank.r2{background:linear-gradient(135deg,#a0a0a0,#808080)}
.attr-rank.r3{background:linear-gradient(135deg,#c8945c,#a87840)}
.attr-name{font-weight:700;font-size:0.85rem;margin-bottom:2px}
.attr-desc{font-size:0.72rem;color:var(--sub);line-height:1.4}
.attr-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.attr-tags span{font-size:0.62rem;padding:2px 6px;border-radius:8px;font-weight:600}
.yn-theme .attr-tags span{background:var(--yn-light);color:var(--yn-dark)}
.gz-theme .attr-tags span{background:var(--gz-light);color:var(--gz-dark)}

.itinerary{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.it-day{
  display:flex;gap:12px;align-items:flex-start;
  background:#fafaf8;border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border);
}
.it-day-num{
  min-width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:0.78rem;color:#fff;flex-shrink:0;
}
.yn-theme .it-day-num{background:var(--yn)}
.gz-theme .it-day-num{background:var(--gz)}
.it-day-content h5{font-size:0.85rem;font-weight:700;margin-bottom:3px}
.it-day-content p{font-size:0.75rem;color:var(--sub);line-height:1.5}

/* Budget dual columns */
.budget-dual{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px;
}
@media(max-width:600px){.budget-dual{grid-template-columns:1fr}}
.budget-plan{
  background:#fafaf8;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);
}
.budget-plan-header{
  padding:14px 16px;color:#fff;display:flex;align-items:center;gap:8px;
  font-weight:800;font-size:0.9rem;
}
.budget-plan-header.eco{background:linear-gradient(135deg,#2d8a6e,#1a6b52)}
.budget-plan-header.premium{background:linear-gradient(135deg,#e8633a,#c44a28)}
.budget-plan-body{padding:14px 16px}
.budget-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid #eee;
}
.budget-row:last-child{border-bottom:none}
.budget-row .br-label{font-size:0.78rem;color:var(--sub)}
.budget-row .br-value{font-size:0.85rem;font-weight:700;text-align:right}
.budget-row .br-detail{font-size:0.68rem;color:var(--sub);text-align:right;margin-top:1px}
.budget-plan-total{
  padding:12px 16px;text-align:center;font-size:1.3rem;font-weight:800;
  border-top:2px dashed #e0dcd0;
}
.budget-plan.eco-plan .budget-plan-total{color:var(--eco);background:linear-gradient(180deg,#f7faf8,#f0f5f2)}
.budget-plan.premium-plan .budget-plan-total{color:var(--premium);background:linear-gradient(180deg,#fef9f6,#fdf3ed)}

/* Comparison bar */
.comparison-bar{
  display:flex;align-items:center;gap:12px;margin:16px 0;padding:14px 18px;
  background:linear-gradient(135deg,#fefdf9,#f8f6ef);border-radius:var(--radius-sm);
  border:1px solid var(--border);font-size:0.82rem;
}
.comparison-bar .cb-icon{font-size:1.5rem}
.comparison-bar .cb-text{color:var(--sub);line-height:1.5}

.empty-state{
  text-align:center;padding:48px 20px;color:var(--sub);
}
.empty-state .es-icon{font-size:4rem;opacity:0.25;margin-bottom:14px}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:0.85rem}

#confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:999}
.c-piece{
  position:absolute;width:10px;height:10px;border-radius:2px;
  animation:cFall 2.8s ease-out forwards;
}
@keyframes cFall{
  0%{transform:translateY(-100vh) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

@media(max-width:600px){
  .header h1{font-size:1.4rem}
  .spin-btn{padding:16px 36px;font-size:1rem}
  .attr-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .slot-card{padding:18px 12px}
  .slot-card .slot-value{font-size:1.2rem}
  .result-banner{padding:16px}
  .result-banner .rb-icon{font-size:2rem}
  .result-banner .rb-info h2{font-size:1.2rem}
}
</style>
</head>

  let isSpinning = false;
  const spinBtn = document.getElementById('spinBtn');
  const resultArea = document.getElementById('resultArea');
  const slotTransport = document.getElementById('slotTransport');
  const slotDest = document.getElementById('slotDest');
  const confettiRoot = document.getElementById('confettiRoot');

  const TE = { highspeed: '🚄', flight: '✈️' };
  const TN = { highspeed: '高铁', flight: '飞机' };
  const DE = { yunnan: '🏔️', guizhou: '⛰️' };
  const DN = { yunnan: '云南', guizhou: '贵州' };

  window.startSpin = function() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add('spinning');

    const finalTransport = TRANSPORTS[Math.floor(Math.random() * 2)];
    const finalDest = DESTINATIONS[Math.floor(Math.random() * 2)];

    slotTransport.classList.add('shaking');
    slotDest.classList.add('shaking');

    let tick = 0;
    const maxTicks = 16;
    const interval = setInterval(function() {
      const t = Math.floor(Math.random() * 2);
      const d = Math.floor(Math.random() * 2);
      slotTransport.querySelector('.slot-emoji').textContent = TE[TRANSPORTS[t]];
      slotTransport.querySelector('.slot-value').textContent = TN[TRANSPORTS[t]];
      slotDest.querySelector('.slot-emoji').textContent = DE[DESTINATIONS[d]];
      slotDest.querySelector('.slot-value').textContent = DN[DESTINATIONS[d]];
      tick++;
      if (tick >= maxTicks) {
        clearInterval(interval);
        slotTransport.querySelector('.slot-emoji').textContent = TE[finalTransport];
        slotTransport.querySelector('.slot-value').textContent = TN[finalTransport];
        slotDest.querySelector('.slot-emoji').textContent = DE[finalDest];
        slotDest.querySelector('.slot-value').textContent = DN[finalDest];
        slotTransport.classList.remove('shaking');
        slotDest.classList.remove('shaking');
        renderResult(finalTransport, finalDest);
        launchConfetti();
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('spinning');
      }
    }, 70);
  };

  function renderResult(transport, dest) {
    const tInfo = TRANSPORT_INFO[transport];
    const dInfo = DEST_INFO[dest];
    const plan = PLANS[dest][transport];
    const seasonTag = dest==='yunnan' ? '3-5月/9-11月' : '4-6月/9-10月';

    let h = '<div class="result-card '+dInfo.css+'">';

    // Banner
    h += '<div class="result-banner '+dInfo.bg+'">';
    h += '<span class="rb-icon">'+dInfo.icon+'</span>';
    h += '<div class="rb-info">';
    h += '<h2>'+dInfo.name+' · '+tInfo.name+'出行</h2>';
    h += '<div class="rb-tags">';
    h += '<span class="rb-tag">'+tInfo.icon+' '+tInfo.name+'出发</span>';
    h += '<span class="rb-tag">'+dInfo.emoji+' 5天4晚</span>';
    h += '<span class="rb-tag">📅 '+seasonTag+'</span>';
    h += '</div></div></div>';

    h += '<div class="result-body">';

    // Attractions
    h += '<div class="section-title">🏆 '+tInfo.name+'出行 · 精选景点</div>';
    h += '<div class="attr-grid">';
    plan.attractions.forEach(function(a,i){
      let rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
      h += '<div class="attr-item">';
      h += '<div class="attr-rank '+rc+'">'+(i+1)+'</div>';
      h += '<div class="attr-name">'+a.name+'</div>';
      h += '<div class="attr-desc">'+a.desc+'</div>';
      h += '<div class="attr-tags">';
      a.tags.forEach(function(t){ h += '<span>'+t+'</span>'; });
      h += '</div></div>';
    });
    h += '</div>';

    // Tab switcher
    h += '<div class="tab-switcher">';
    h += '<button class="tab-btn eco-tab active" onclick="switchTab(\'eco\',this)">🌱 经济实惠</button>';
    h += '<button class="tab-btn premium-tab" onclick="switchTab(\'premium\',this)">👑 品质享受</button>';
    h += '</div>';

    // ECO tab content
    h += '<div class="tab-content active" id="tab-eco">';
    h += '<div class="section-title">🗓️ 经济实惠路线</div>';
    h += '<div class="itinerary">';
    plan.eco.itinerary.forEach(function(d,i){
      h += '<div class="it-day"><div class="it-day-num">D'+(i+1)+'</div>';
      h += '<div class="it-day-content"><h5>'+d.title+'</h5><p>'+d.desc+'</p></div></div>';
    });
    h += '</div>';
    h += buildBudgetTable(plan.eco, 'eco');
    h += '</div>';

    // PREMIUM tab content
    h += '<div class="tab-content" id="tab-premium">';
    h += '<div class="section-title">🗓️ 品质享受路线</div>';
    h += '<div class="itinerary">';
    plan.premium.itinerary.forEach(function(d,i){
      h += '<div class="it-day"><div class="it-day-num">D'+(i+1)+'</div>';
      h += '<div class="it-day-content"><h5>'+d.title+'</h5><p>'+d.desc+'</p></div></div>';
    });
    h += '</div>';
    h += buildBudgetTable(plan.premium, 'premium');
    h += '</div>';

    // Comparison
    h += '<div class="comparison-bar">';
    h += '<span class="cb-icon">💡</span>';
    h += '<span class="cb-text"><b>差价约 ¥'+(plan.premium.totalNum - plan.eco.totalNum).toLocaleString()+'/人</b> —— 经济方案省下的钱可以再玩一趟！品质方案多花的钱换来 VIP通道、高端住宿和更深度体验。</span>';
    h += '</div>';

    h += '</div></div>';
    resultArea.innerHTML = h;

    if (window.innerWidth < 768) {
      setTimeout(function(){
        resultArea.querySelector('.result-card').scrollIntoView({behavior:'smooth',block:'start'});
      }, 100);
    }
  }

  function buildBudgetTable(plan, type) {
    let cls = type==='eco' ? 'eco-plan' : 'premium-plan';
    let hdrCls = type==='eco' ? 'eco' : 'premium';
    let hdrIcon = type==='eco' ? '🌱' : '👑';
    let hdrTitle = type==='eco' ? '经济实惠 · 预算明细' : '品质享受 · 预算明细';
    let h = '<div class="budget-plan '+cls+'">';
    h += '<div class="budget-plan-header '+hdrCls+'">'+hdrIcon+' '+hdrTitle+'</div>';
    h += '<div class="budget-plan-body">';
    plan.budget.forEach(function(b){
      h += '<div class="budget-row">';
      h += '<span class="br-label">'+b.label+'</span>';
      h += '<div><div class="br-value">'+b.value+'</div><div class="br-detail">'+b.detail+'</div></div>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="budget-plan-total">'+plan.total+'</div>';
    h += '</div>';
    return h;
  }

  window.switchTab = function(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById('tab-'+tab).classList.add('active');
    btn.classList.add('active');
  };

  function launchConfetti() {
    const frag = document.createDocumentFragment();
    const colors = ['#e8633a','#2d8a6e','#f5a623','#6a9bcc','#e06090','#9b59b6','#f39c12','#1abc9c'];
    for (let i=0; i<50; i++) {
      const p = document.createElement('div'); p.className='c-piece';
      p.style.left = Math.random()*100+'%';
      p.style.top = -(Math.random()*20)+'px';
      p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = Math.random()*0.6+'s';
      p.style.animationDuration = (Math.random()*2+2.2)+'s';
      p.style.width = (Math.random()*8+5)+'px';
      p.style.height = (Math.random()*8+5)+'px';
      frag.appendChild(p);
    }
    confettiRoot.innerHTML = '';
    confettiRoot.appendChild(frag);
    setTimeout(function(){ confettiRoot.innerHTML = ''; }, 3500);
  }

})();
