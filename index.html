<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下一站去哪儿？- 智能旅行规划</title>
<style>
:root {
  --bg: #f7f5f0;
  --card: #fff;
  --text: #2d2d2d;
  --sub: #7a7a7a;
  --border: #e8e6dc;
  --yn: #e8633a;
  --yn-light: #fdf2ed;
  --yn-dark: #c44a28;
  --gz: #2d8a6e;
  --gz-light: #edf7f2;
  --gz-dark: #1a6b52;
  --gold: #f0a030;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 6px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 14px 48px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.container{width:100%;max-width:820px;display:flex;flex-direction:column;align-items:center}

/* Header */
.header{text-align:center;margin:20px 0 28px}
.header h1{
  font-size:1.8rem;font-weight:800;letter-spacing:-0.03em;
  background:linear-gradient(135deg,var(--yn),var(--gz));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header p{color:var(--sub);font-size:0.9rem;margin-top:6px}

/* Spin Button - Large */
.spin-btn{
  display:flex;align-items:center;gap:10px;
  padding:18px 48px;border-radius:60px;border:none;cursor:pointer;
  font-size:1.15rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#ff6b4a,#e8633a);
  box-shadow:0 6px 28px rgba(232,99,58,0.38);
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  margin-bottom:32px;letter-spacing:0.03em;
  position:relative;overflow:hidden;
}
.spin-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
}
.spin-btn:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(232,99,58,0.5)}
.spin-btn:active{transform:scale(0.96)}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
.spin-btn .btn-icon{font-size:1.6rem;display:inline-block}
@keyframes diceRoll{
  0%{transform:rotateY(0) scale(1)}
  25%{transform:rotateY(180deg) scale(0.8)}
  50%{transform:rotateY(360deg) scale(1.1)}
  75%{transform:rotateY(540deg) scale(0.9)}
  100%{transform:rotateY(720deg) scale(1)}
}
.spin-btn.spinning .btn-icon{animation:diceRoll 0.9s ease-out}

/* Slot Machine */
.slot-area{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  width:100%;margin-bottom:28px
}
.slot-card{
  flex:1 1 180px;max-width:260px;min-width:150px;
  background:var(--card);border-radius:var(--radius);
  padding:24px 18px;text-align:center;
  border:2px solid var(--border);
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
  cursor:default;position:relative;
}
.slot-card .slot-label{
  font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--sub);margin-bottom:8px;font-weight:700;
}
.slot-card .slot-value{
  font-size:1.4rem;font-weight:800;margin-bottom:4px;
  transition:all 0.2s;
}
.slot-card .slot-emoji{font-size:2.2rem;display:block;margin-bottom:6px}
@keyframes slotShake{
  0%,100%{transform:translateY(0)}
  15%{transform:translateY(-6px)}
  30%{transform:translateY(6px)}
  45%{transform:translateY(-3px)}
  60%{transform:translateY(3px)}
  75%{transform:translateY(-1px)}
}
.slot-card.shaking{animation:slotShake 0.6s ease-in-out}

/* Result Card */
.result-card{
  background:var(--card);border-radius:var(--radius);
  padding:0;width:100%;box-shadow:var(--shadow-md);
  border:1px solid var(--border);
  overflow:hidden;
  animation:fadeSlideIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
.result-banner{
  padding:22px 24px;display:flex;align-items:center;gap:14px;
  color:#fff;
}
.result-banner.yn-bg{background:linear-gradient(135deg,#e8633a,#d44a2a)}
.result-banner.gz-bg{background:linear-gradient(135deg,#2d8a6e,#1a6b52)}
.result-banner .rb-icon{font-size:2.6rem}
.result-banner .rb-info h2{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em}
.result-banner .rb-info .rb-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.rb-tag{
  font-size:0.72rem;padding:3px 10px;border-radius:20px;
  background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);
  font-weight:600;
}

.result-body{padding:24px}

/* Section Title */
.section-title{
  font-size:0.78rem;font-weight:800;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--sub);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* Transport Info */
.transport-bar{
  display:flex;align-items:center;gap:12px;
  background:#fafaf8;border-radius:var(--radius-sm);
  padding:16px 20px;margin-bottom:20px;
  border:1px solid var(--border);
}
.transport-bar .tb-icon{font-size:1.8rem}
.transport-bar .tb-details h4{font-size:0.9rem;font-weight:700;margin-bottom:3px}
.transport-bar .tb-details p{font-size:0.78rem;color:var(--sub)}

/* Attraction Grid */
.attr-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:12px;margin-bottom:20px;
}
.attr-item{
  background:#fafaf8;border-radius:var(--radius-sm);padding:14px;
  border:1px solid var(--border);transition:all 0.2s;
}
.attr-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:#ccc}
.attr-rank{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;font-size:0.7rem;
  font-weight:800;color:#fff;margin-bottom:8px;
}
.attr-rank.r1{background:linear-gradient(135deg,#f5a623,#e8961a)}
.attr-rank.r2{background:linear-gradient(135deg,#a0a0a0,#808080)}
.attr-rank.r3{background:linear-gradient(135deg,#c8945c,#a87840)}
.attr-name{font-weight:700;font-size:0.9rem;margin-bottom:3px}
.attr-desc{font-size:0.75rem;color:var(--sub);line-height:1.4}
.attr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.attr-tags span{
  font-size:0.65rem;padding:2px 7px;border-radius:10px;font-weight:600;
}
.yn-theme .attr-tags span{background:var(--yn-light);color:var(--yn-dark)}
.gz-theme .attr-tags span{background:var(--gz-light);color:var(--gz-dark)}

/* Itinerary */
.itinerary{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.it-day{
  display:flex;gap:14px;align-items:flex-start;
  background:#fafaf8;border-radius:var(--radius-sm);padding:16px;
  border:1px solid var(--border);
}
.it-day-num{
  min-width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:0.85rem;color:#fff;flex-shrink:0;
}
.yn-theme .it-day-num{background:var(--yn)}
.gz-theme .it-day-num{background:var(--gz)}
.it-day-content h5{font-size:0.9rem;font-weight:700;margin-bottom:4px}
.it-day-content p{font-size:0.78rem;color:var(--sub);line-height:1.5}
.it-day-content .it-meal{font-size:0.7rem;color:var(--sub);margin-top:4px;font-style:italic}

/* Budget */
.budget-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;margin-bottom:12px;
}
.budget-item{
  background:#fafaf8;border-radius:var(--radius-sm);padding:16px;
  text-align:center;border:1px solid var(--border);
}
.budget-item .bi-amount{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em}
.budget-item .bi-label{font-size:0.72rem;color:var(--sub);margin-top:4px}
.yn-theme .bi-amount{color:var(--yn)}
.gz-theme .bi-amount{color:var(--gz)}
.budget-total{
  background:linear-gradient(135deg,#fef9f5,#f8f4ef);
  border-radius:var(--radius-sm);padding:18px 24px;text-align:center;
  border:2px solid var(--gold);
}
.budget-total .bt-label{font-size:0.78rem;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:0.06em}
.budget-total .bt-amount{font-size:2rem;font-weight:800;color:var(--gold);margin-top:4px}

/* Empty state */
.empty-state{
  text-align:center;padding:48px 20px;color:var(--sub);
}
.empty-state .es-icon{font-size:4rem;opacity:0.25;margin-bottom:14px}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:0.85rem}

/* Confetti */
#confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:999}
.c-piece{
  position:absolute;width:10px;height:10px;border-radius:2px;
  animation:cFall 2.8s ease-out forwards;
}
@keyframes cFall{
  0%{transform:translateY(-100vh) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* Responsive */
@media(max-width:600px){
  .header h1{font-size:1.4rem}
  .spin-btn{padding:16px 36px;font-size:1rem}
  .attr-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .budget-grid{grid-template-columns:repeat(2,1fr)}
  .slot-card{padding:18px 12px}
  .slot-card .slot-value{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="container">
<div class="header">

  <p>随机出行方式 · 智能路线规划 · 经费预算一步到位</p>

<div class="slot-area" id="slotArea">

    <span class="slot-emoji">🏔️</span>

<button class="spin-btn" id="spinBtn" onclick="startSpin()">

<div id="resultArea">
  <div class="empty-state" id="emptyState">

</div>
</div>
<div id="confettiRoot"></div>

        { title: '西江千户苗寨', desc: '上午高铁至凯里(40min)，转车至苗寨，下午穿苗服拍照，晚上观景台看万家灯火', meal: '🍲 晚餐: 长桌宴 + 酸汤鱼' },
        { title: '荔波小七孔', desc: '上午高铁至荔波(1h)，漫步水上森林、拉雅瀑布、卧龙潭', meal: '🐟 午餐: 樟江烤鱼 + 虾酸牛肉' },
        { title: '返程', desc: '上午贵阳逛黔灵山公园看猴子，买茅台/老干妈伴手礼，下午高铁返程', meal: '🎁 伴手礼: 茅台镇酒 + 老干妈 + 刺梨干' },
      ],
      flight: [
        { title: '抵达贵阳', desc: '飞抵贵阳龙洞堡机场，晚上逛花果园"白宫"夜景、二七路小吃街', meal: '🍜 晚餐: 花溪牛肉粉 + 豆腐圆子' },
        { title: '梵净山朝圣', desc: '上午高铁至铜仁(1h)+转车至梵净山，登红云金顶看云海佛光', meal: '🥘 午餐: 铜仁锅巴粉 + 米豆腐' },
        { title: '织金洞探险', desc: '上午高铁至织金(1h)，探秘地下溶洞宫殿，下午返回贵阳', meal: '🍲 晚餐: 酸汤鱼 + 小米渣' },
        { title: '赤水丹霞', desc: '上午高铁至赤水(2h)，赤水大瀑布+佛光岩，傍晚返回', meal: '🐔 午餐: 赤水豆花烤鱼 + 竹筒饭' },
        { title: '返程', desc: '上午黔灵山看猴子、买特产，下午贵阳机场飞回', meal: '🎁 伴手礼: 茅台冰淇淋 + 刺梨原液' },
      ]
    }
  };

  const BUDGETS = {
    yunnan: {
      highspeed: {
        transport: '¥600-900/人', transportNum: 750,
        hotel: '¥150-250/晚', hotelNum: 200,
        tickets: '¥300-500/人', ticketsNum: 400,
        food: '¥80-150/天', foodNum: 115,
        total: '¥2,500-4,000/人', totalNum: 3250
      },
      flight: {
        transport: '¥800-1,500/人', transportNum: 1150,
        hotel: '¥180-300/晚', hotelNum: 240,
        tickets: '¥350-600/人', ticketsNum: 475,
        food: '¥100-180/天', foodNum: 140,
        total: '¥3,500-5,500/人', totalNum: 4500
      }
    },
    guizhou: {
      highspeed: {
        transport: '¥400-700/人', transportNum: 550,
        hotel: '¥120-200/晚', hotelNum: 160,
        tickets: '¥250-450/人', ticketsNum: 350,
        food: '¥60-120/天', foodNum: 90,
        total: '¥1,800-3,200/人', totalNum: 2500
      },
      flight: {
        transport: '¥600-1,200/人', transportNum: 900,
        hotel: '¥150-250/晚', hotelNum: 200,
        tickets: '¥300-500/人', ticketsNum: 400,
        food: '¥80-150/天', foodNum: 115,
        total: '¥2,800-4,500/人', totalNum: 3650
      }
    }
  };

  // ===== State =====
  let isSpinning = false;

  // ===== DOM refs =====
  const spinBtn = document.getElementById('spinBtn');
  const resultArea = document.getElementById('resultArea');
  const slotTransport = document.getElementById('slotTransport');
  const slotDest = document.getElementById('slotDest');
  const confettiRoot = document.getElementById('confettiRoot');

  const TRANSPORT_EMOJIS = { highspeed: '🚄', flight: '✈️' };
  const TRANSPORT_NAMES = { highspeed: '高铁', flight: '飞机' };
  const DEST_NAMES = { yunnan: '云南', guizhou: '贵州' };
  const DEST_EMOJIS = { yunnan: '🏔️', guizhou: '⛰️' };

  // ===== Spin =====
  window.startSpin = function() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add('spinning');

    // Final random picks
    const finalTransport = TRANSPORTS[Math.floor(Math.random() * 2)];
    const finalDest = DESTINATIONS[Math.floor(Math.random() * 2)];

    // Animate slots
    slotTransport.classList.add('shaking');
    slotDest.classList.add('shaking');

    let tick = 0;
    const maxTicks = 16;
    const interval = setInterval(function() {
      const t = Math.floor(Math.random() * 2);
      const d = Math.floor(Math.random() * 2);
      slotTransport.querySelector('.slot-emoji').textContent = TRANSPORT_EMOJIS[TRANSPORTS[t]];
      slotTransport.querySelector('.slot-value').textContent = TRANSPORT_NAMES[TRANSPORTS[t]];
      slotDest.querySelector('.slot-emoji').textContent = DEST_EMOJIS[DESTINATIONS[d]];
      slotDest.querySelector('.slot-value').textContent = DEST_NAMES[DESTINATIONS[d]];
      tick++;
      if (tick >= maxTicks) {
        clearInterval(interval);
        // Set final values
        slotTransport.querySelector('.slot-emoji').textContent = TRANSPORT_EMOJIS[finalTransport];
        slotTransport.querySelector('.slot-value').textContent = TRANSPORT_NAMES[finalTransport];
        slotDest.querySelector('.slot-emoji').textContent = DEST_EMOJIS[finalDest];
        slotDest.querySelector('.slot-value').textContent = DEST_NAMES[finalDest];
        slotTransport.classList.remove('shaking');
        slotDest.classList.remove('shaking');
        // Render result
        renderResult(finalTransport, finalDest);
        launchConfetti();
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('spinning');
      }
    }, 70);
  };

  // ===== Render =====
  function renderResult(transport, dest) {
    const tInfo = TRANSPORT_INFO[transport];
    const dInfo = DEST_INFO[dest];
    const attrs = ATTRACTIONS[dest][transport];
    const plan = ITINERARIES[dest][transport];
    const budget = BUDGETS[dest][transport];

    let h = '<div class="result-card '+dInfo.css+'">';

    // Banner
    h += '<div class="result-banner '+dInfo.bg+'">';
    h += '<span class="rb-icon">'+dInfo.icon+'</span>';
    h += '<div class="rb-info">';
    h += '<h2>'+dInfo.name+' · '+tInfo.name+'出行</h2>';
    h += '<div class="rb-tags">';
    h += '<span class="rb-tag">'+tInfo.icon+' '+tInfo.name+'出发</span>';
    h += '<span class="rb-tag">'+dInfo.emoji+' 5天4晚</span>';
    h += '<span class="rb-tag">📅 推荐季节: '+(dest==='yunnan'?'3-5月/9-11月':'4-6月/9-10月')+'</span>';
    h += '</div></div></div>';

    // Body
    h += '<div class="result-body">';

    // Transport info
    h += '<div class="section-title">🚗 出行信息</div>';
    h += '<div class="transport-bar">';
    h += '<span class="tb-icon">'+tInfo.icon+'</span>';
    h += '<div class="tb-details">';
    h += '<h4>'+tInfo.name+' · '+dInfo.name+'</h4>';
    h += '<p>'+budget.transport+' | 建议提前15-30天订票更划算</p>';
    h += '</div></div>';

    // Attractions (transport-specific)
    h += '<div class="section-title">🏆 '+tInfo.name+'出行 · 精选景点 ('+attrs.length+'个)</div>';
    h += '<div class="attr-grid">';
    attrs.forEach(function(a,i){
      let rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
      h += '<div class="attr-item">';
      h += '<div class="attr-rank '+rc+'">'+(i+1)+'</div>';
      h += '<div class="attr-name">'+a.name+'</div>';
      h += '<div class="attr-desc">'+a.desc+'</div>';
      h += '<div class="attr-tags">';
      a.tags.forEach(function(t){ h += '<span>'+t+'</span>'; });
      h += '</div></div>';
    });
    h += '</div>';

    // Itinerary
    h += '<div class="section-title">🗓️ 5天4晚路线规划</div>';
    h += '<div class="itinerary">';
    plan.forEach(function(day,i){
      h += '<div class="it-day">';
      h += '<div class="it-day-num">Day '+(i+1)+'</div>';
      h += '<div class="it-day-content">';
      h += '<h5>'+day.title+'</h5>';
      h += '<p>'+day.desc+'</p>';
      if(day.meal) h += '<div class="it-meal">'+day.meal+'</div>';
      h += '</div></div>';
    });
    h += '</div>';

    // Budget
    h += '<div class="section-title">💰 经费预算 (人均)</div>';
    h += '<div class="budget-grid">';
    h += '<div class="budget-item"><div class="bi-amount">'+budget.transport+'</div><div class="bi-label">🚗 往返交通</div></div>';
    h += '<div class="budget-item"><div class="bi-amount">'+budget.hotel+'</div><div class="bi-label">🏨 住宿/晚</div></div>';
    h += '<div class="budget-item"><div class="bi-amount">'+budget.tickets+'</div><div class="bi-label">🎫 门票合计</div></div>';
    h += '<div class="budget-item"><div class="bi-amount">'+budget.food+'</div><div class="bi-label">🍽️ 餐饮/天</div></div>';
    h += '</div>';
    h += '<div class="budget-total">';
    h += '<div class="bt-label">5天4晚预估总费用 (人均)</div>';
    h += '<div class="bt-amount">'+budget.total+'</div>';
    h += '</div>';

    h += '</div></div>';

    resultArea.innerHTML = h;

    // Scroll to result on mobile
    if (window.innerWidth < 768) {
      setTimeout(function(){
        resultArea.querySelector('.result-card').scrollIntoView({behavior:'smooth',block:'start'});
      }, 100);
    }
  }

  // ===== Confetti =====
  function launchConfetti() {
    const frag = document.createDocumentFragment();
    const colors = ['#e8633a','#2d8a6e','#f5a623','#6a9bcc','#e06090','#9b59b6','#f39c12','#1abc9c'];
    for (let i=0; i<50; i++) {
      const p = document.createElement('div'); p.className='c-piece';
      p.style.left = Math.random()*100+'%';
      p.style.top = -(Math.random()*20)+'px';
      p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = Math.random()*0.6+'s';
      p.style.animationDuration = (Math.random()*2+2.2)+'s';
      p.style.width = (Math.random()*8+5)+'px';
      p.style.height = (Math.random()*8+5)+'px';
      frag.appendChild(p);
    }
    confettiRoot.innerHTML = '';
    confettiRoot.appendChild(frag);
    setTimeout(function(){ confettiRoot.innerHTML = ''; }, 3500);
  }

})();
</script></body></html>
