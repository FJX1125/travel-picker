<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下一站去哪儿？- AI智能旅行规划</title>
<style>
:root {
  --bg: #f7f5f0; --card: #fff; --text: #2d2d2d; --sub: #7a7a7a; --border: #e8e6dc;
  --yn: #e8633a; --yn-light: #fdf2ed; --yn-dark: #c44a28;
  --gz: #2d8a6e; --gz-light: #edf7f2; --gz-dark: #1a6b52;
  --gold: #f0a030; --eco: #2d8a6e; --premium: #e8633a;
  --ai: #6c5ce7; --ai-light: #f3f0ff;
  --radius: 22px; --radius-sm: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 6px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 14px 48px rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.container{width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center}

.header{text-align:center;margin:20px 0 28px}
.header h1{
  font-size:1.8rem;font-weight:800;letter-spacing:-0.03em;
  background:linear-gradient(135deg,var(--yn),var(--gz));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header p{color:var(--sub);font-size:0.9rem;margin-top:6px}

/* AI Agent Button */
.ai-agent-trigger{
  display:flex;align-items:center;gap:8px;
  padding:12px 24px;border-radius:48px;border:2px solid var(--ai);
  background:var(--ai-light);color:var(--ai);
  font-size:0.95rem;font-weight:700;cursor:pointer;
  transition:all 0.3s;margin-bottom:20px;
}
.ai-agent-trigger:hover{
  background:var(--ai);color:#fff;transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(108,92,231,0.3);
}
.ai-agent-trigger .ai-dot{
  width:10px;height:10px;border-radius:50%;background:var(--ai);
  animation:pulse 1.5s ease-in-out infinite;
}
.ai-agent-trigger:hover .ai-dot{background:#fff}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)}}

.spin-btn{
  display:flex;align-items:center;gap:10px;
  padding:18px 48px;border-radius:60px;border:none;cursor:pointer;
  font-size:1.15rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#ff6b4a,#e8633a);
  box-shadow:0 6px 28px rgba(232,99,58,0.38);
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  margin-bottom:32px;letter-spacing:0.03em;
  position:relative;overflow:hidden;
}
.spin-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent)}
.spin-btn:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(232,99,58,0.5)}
.spin-btn:active{transform:scale(0.96)}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
.spin-btn .btn-icon{font-size:1.6rem;display:inline-block}
@keyframes diceRoll{
  0%{transform:rotateY(0) scale(1)} 25%{transform:rotateY(180deg) scale(0.8)}
  50%{transform:rotateY(360deg) scale(1.1)} 75%{transform:rotateY(540deg) scale(0.9)}
  100%{transform:rotateY(720deg) scale(1)}
}
.spin-btn.spinning .btn-icon{animation:diceRoll 0.9s ease-out}

.slot-area{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;margin-bottom:28px
}
.slot-card{
  flex:1 1 180px;max-width:260px;min-width:150px;
  background:var(--card);border-radius:var(--radius);padding:24px 18px;
  text-align:center;border:2px solid var(--border);
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);cursor:default;position:relative;
}
.slot-card .slot-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--sub);margin-bottom:8px;font-weight:700}
.slot-card .slot-value{font-size:1.4rem;font-weight:800;margin-bottom:4px;transition:all 0.2s}
.slot-card .slot-emoji{font-size:2.2rem;display:block;margin-bottom:6px}
@keyframes slotShake{
  0%,100%{transform:translateY(0)} 15%{transform:translateY(-6px)} 30%{transform:translateY(6px)}
  45%{transform:translateY(-3px)} 60%{transform:translateY(3px)} 75%{transform:translateY(-1px)}
}
.slot-card.shaking{animation:slotShake 0.6s ease-in-out}

.result-card{
  background:var(--card);border-radius:var(--radius);padding:0;
  width:100%;box-shadow:var(--shadow-md);border:1px solid var(--border);
  overflow:hidden;animation:fadeSlideIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
  margin-bottom:20px;
}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)}
}
.result-banner{
  padding:22px 24px;display:flex;align-items:center;gap:14px;color:#fff;
}
.result-banner.yn-bg{background:linear-gradient(135deg,#e8633a,#c44a28)}
.result-banner.gz-bg{background:linear-gradient(135deg,#2d8a6e,#1a6b52)}
.result-banner .rb-icon{font-size:2.6rem}
.result-banner .rb-info h2{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em}
.result-banner .rb-info .rb-tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.rb-tag{font-size:0.72rem;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);font-weight:600}
.result-body{padding:24px}

.tab-switcher{
  display:flex;gap:0;margin-bottom:20px;background:#f0ede6;border-radius:var(--radius-sm);padding:4px;
}
.tab-btn{
  flex:1;padding:12px;border:none;cursor:pointer;font-size:0.9rem;font-weight:700;
  border-radius:12px;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  background:transparent;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab-btn.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.tab-btn.eco-tab.active{color:var(--eco)}
.tab-btn.premium-tab.active{color:var(--premium)}
.tab-content{display:none}
.tab-content.active{display:block}

.section-title{
  font-size:0.78rem;font-weight:800;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--sub);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.transport-bar{
  display:flex;align-items:center;gap:12px;background:#fafaf8;
  border-radius:var(--radius-sm);padding:16px 20px;margin-bottom:20px;border:1px solid var(--border);
}
.transport-bar .tb-icon{font-size:1.8rem}
.transport-bar .tb-details h4{font-size:0.9rem;font-weight:700;margin-bottom:3px}
.transport-bar .tb-details p{font-size:0.78rem;color:var(--sub)}

.attr-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:10px;margin-bottom:20px;
}
.attr-item{
  background:#fafaf8;border-radius:var(--radius-sm);padding:12px;
  border:1px solid var(--border);transition:all 0.2s;
}
.attr-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:#ccc}
.attr-rank{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:0.65rem;font-weight:800;color:#fff;margin-bottom:6px;
}
.attr-rank.r1{background:linear-gradient(135deg,#f5a623,#e8961a)}
.attr-rank.r2{background:linear-gradient(135deg,#a0a0a0,#808080)}
.attr-rank.r3{background:linear-gradient(135deg,#c8945c,#a87840)}
.attr-name{font-weight:700;font-size:0.85rem;margin-bottom:2px}
.attr-desc{font-size:0.72rem;color:var(--sub);line-height:1.4}
.attr-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.attr-tags span{font-size:0.62rem;padding:2px 6px;border-radius:8px;font-weight:600}
.yn-theme .attr-tags span{background:var(--yn-light);color:var(--yn-dark)}
.gz-theme .attr-tags span{background:var(--gz-light);color:var(--gz-dark)}

.itinerary{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.it-day{
  display:flex;gap:12px;align-items:flex-start;
  background:#fafaf8;border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border);
}
.it-day-num{
  min-width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:0.78rem;color:#fff;flex-shrink:0;
}
.yn-theme .it-day-num{background:var(--yn)}
.gz-theme .it-day-num{background:var(--gz)}
.it-day-content h5{font-size:0.85rem;font-weight:700;margin-bottom:3px}
.it-day-content p{font-size:0.75rem;color:var(--sub);line-height:1.5}

.budget-plan-header{
  padding:14px 16px;color:#fff;display:flex;align-items:center;gap:8px;
  font-weight:800;font-size:0.9rem;
}
.budget-plan-header.eco{background:linear-gradient(135deg,#2d8a6e,#1a6b52)}
.budget-plan-header.premium{background:linear-gradient(135deg,#e8633a,#c44a28)}
.budget-plan{
  background:#fafaf8;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);
}
.budget-plan-body{padding:14px 16px}
.budget-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid #eee;
}
.budget-row:last-child{border-bottom:none}
.budget-row .br-label{font-size:0.78rem;color:var(--sub)}
.budget-row .br-value{font-size:0.85rem;font-weight:700;text-align:right}
.budget-row .br-detail{font-size:0.68rem;color:var(--sub);text-align:right;margin-top:1px}
.budget-plan-total{
  padding:12px 16px;text-align:center;font-size:1.3rem;font-weight:800;
  border-top:2px dashed #e0dcd0;
}
.budget-plan.eco-plan .budget-plan-total{color:var(--eco);background:linear-gradient(180deg,#f7faf8,#f0f5f2)}
.budget-plan.premium-plan .budget-plan-total{color:var(--premium);background:linear-gradient(180deg,#fef9f6,#fdf3ed)}

.comparison-bar{
  display:flex;align-items:center;gap:12px;margin:16px 0;padding:14px 18px;
  background:linear-gradient(135deg,#fefdf9,#f8f6ef);border-radius:var(--radius-sm);
  border:1px solid var(--border);font-size:0.82rem;
}
.comparison-bar .cb-icon{font-size:1.5rem}
.comparison-bar .cb-text{color:var(--sub);line-height:1.5}

/* AI Chat Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);
  z-index:100;display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.chat-panel{
  width:100%;max-width:520px;max-height:80vh;background:#fff;
  border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,0.15);
  animation:slideUp 0.35s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
.chat-header{
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.chat-header h3{
  font-size:1.05rem;display:flex;align-items:center;gap:8px;
}
.chat-header h3 .ch-icon{font-size:1.4rem}
.chat-header .ch-close{
  width:32px;height:32px;border-radius:50%;border:none;
  background:#f0ede6;cursor:pointer;font-size:1rem;display:flex;
  align-items:center;justify-content:center;transition:all 0.2s;
}
.chat-header .ch-close:hover{background:#ddd;transform:scale(1.1)}
.chat-messages{
  flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;
  min-height:200px;max-height:50vh;
}
.msg{
  max-width:85%;padding:12px 16px;border-radius:18px;font-size:0.85rem;line-height:1.5;
  animation:msgIn 0.3s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)}}
.msg.bot{
  background:#f3f0ff;color:var(--text);align-self:flex-start;
  border-bottom-left-radius:6px;
}
.msg.user{
  background:var(--ai);color:#fff;align-self:flex-end;
  border-bottom-right-radius:6px;
}
.msg .quick-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .qa-btn{
  padding:6px 12px;border-radius:16px;border:1px solid var(--ai);
  background:#fff;color:var(--ai);font-size:0.75rem;cursor:pointer;
  font-weight:600;transition:all 0.2s;
}
.msg .qa-btn:hover{background:var(--ai);color:#fff}
.chat-input-area{
  padding:12px 16px 20px;display:flex;gap:10px;border-top:1px solid var(--border);
}
.chat-input-area input{
  flex:1;padding:12px 16px;border-radius:24px;border:2px solid var(--border);
  font-size:0.9rem;outline:none;transition:border-color 0.2s;background:#fafaf8;
}
.chat-input-area input:focus{border-color:var(--ai)}
.chat-input-area button{
  padding:12px 20px;border-radius:24px;border:none;background:var(--ai);
  color:#fff;font-weight:700;cursor:pointer;font-size:0.85rem;
  transition:all 0.2s;
}
.chat-input-area button:hover{background:#5b4bd5;transform:scale(1.03)}
.chat-input-area button:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* Typing indicator */
.typing-indicator{display:flex;gap:4px;padding:8px 12px}
.typing-indicator span{
  width:7px;height:7px;border-radius:50%;background:var(--ai);
  animation:typingBounce 1.2s ease-in-out infinite;
}
.typing-indicator span:nth-child(2){animation-delay:0.15s}
.typing-indicator span:nth-child(3){animation-delay:0.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1}}

.empty-state{
  text-align:center;padding:48px 20px;color:var(--sub);
}
.empty-state .es-icon{font-size:4rem;opacity:0.25;margin-bottom:14px}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:0.85rem}

#confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:999}
.c-piece{
  position:absolute;width:10px;height:10px;border-radius:2px;
  animation:cFall 2.8s ease-out forwards;
}
@keyframes cFall{
  0%{transform:translateY(-100vh) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

@media(max-width:600px){
  .header h1{font-size:1.4rem}
  .spin-btn{padding:16px 36px;font-size:1rem}
  .attr-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .slot-card{padding:18px 12px}
  .slot-card .slot-value{font-size:1.2rem}
  .result-banner{padding:16px}
  .result-banner .rb-icon{font-size:2rem}
  .result-banner .rb-info h2{font-size:1.2rem}
  .chat-panel{max-width:100%;border-radius:20px 20px 0 0}
}
</style>
</head>

  // ===== AI Engine =====
  function analyzeIntent(input) {
    const q = input.toLowerCase();
    let scores = { yunnan: 0, guizhou: 0 };
    let reasons = [];
    let budgetLevel = null, transportPref = null;

    for (const [dest, keywords] of Object.entries(DEST_KEYWORDS)) {
      for (const kw of keywords) {
        if (q.includes(kw)) { scores[dest] += 3; reasons.push('你对'+kw+'感兴趣'); }
      }
    }

    const budgetMatch = q.match(/(\d+)\s*[块元]/);
    if (budgetMatch || q.includes('预算') || q.includes('省钱') || q.includes('便宜') || q.includes('经济')) {
      if (q.includes('省钱') || q.includes('便宜') || q.includes('经济实惠') || (budgetMatch && parseInt(budgetMatch[1]) < 3000)) {
        budgetLevel = 'eco'; reasons.push('你想要经济实惠的方案');
      }
    }
    if (q.includes('品质') || q.includes('高端') || q.includes('豪华') || q.includes('享受') || q.includes('五星') || q.includes('商务') || (budgetMatch && parseInt(budgetMatch[1]) > 5000)) {
      budgetLevel = 'premium'; reasons.push('你想要品质享受的体验');
    }
    if (q.includes('高铁') || q.includes('火车') || q.includes('动车')) { transportPref = 'highspeed'; reasons.push('你偏好高铁出行'); }
    if (q.includes('飞机') || q.includes('机票') || q.includes('航班')) { transportPref = 'flight'; reasons.push('你偏好飞机出行'); }
    if (q.includes('夏天') || q.includes('暑假') || q.includes('避暑')) { scores.guizhou += 2; reasons.push('夏天避暑适合去贵州'); }
    if (q.includes('冬天') || q.includes('温暖') || q.includes('过冬') || q.includes('热带')) { scores.yunnan += 2; reasons.push('冬天暖和适合去云南'); }
    if (q.includes('春天') || q.includes('花') || q.includes('花海') || q.includes('杜鹃')) { scores.guizhou += 2; reasons.push('春天适合去贵州看花海'); }
    if (q.includes('雪山') || q.includes('高原') || q.includes('湖泊') || q.includes('洱海') || q.includes('丽江')) { scores.yunnan += 2; }
    if (q.includes('瀑布') || q.includes('溶洞') || q.includes('丹霞') || q.includes('喀斯特') || q.includes('峡谷')) { scores.guizhou += 2; }
    if (q.includes('父母') || q.includes('老人') || q.includes('爸妈')) { scores.yunnan += 1; reasons.push('带长辈去云南比较舒适'); }
    if (q.includes('情侣') || q.includes('蜜月') || q.includes('浪漫')) { scores.yunnan += 2; reasons.push('云南是情侣浪漫之选'); }
    if (q.includes('美食') || q.includes('吃') || q.includes('小吃')) { scores.guizhou += 1; reasons.push('贵州美食很丰富'); }
    if (q.includes('拍照') || q.includes('摄影') || q.includes('网红') || q.includes('打卡')) { scores.yunnan += 1; reasons.push('云南非常适合拍照打卡'); }
    if (q.includes('徒步') || q.includes('登山') || q.includes('探险') || q.includes('户外')) { scores.guizhou += 1; reasons.push('贵州户外探险资源丰富'); }
    if (q.includes('古镇') || q.includes('古城') || q.includes('人文') || q.includes('文化')) { scores.yunnan += 2; }
    if (q.includes('民族') || q.includes('苗') || q.includes('侗') || q.includes('少数民族')) { scores.guizhou += 2; reasons.push('贵州少数民族风情浓郁'); }
    if (q.includes('温泉') || q.includes('泡汤')) { scores.yunnan += 1; reasons.push('云南腾冲温泉很棒'); }
    if (q.includes('带娃') || q.includes('孩子') || q.includes('小孩')) { scores.yunnan += 1; reasons.push('云南适合亲子游'); }

    if (scores.yunnan === scores.guizhou) {
      if (budgetMatch && parseInt(budgetMatch[1]) < 2500) { scores.guizhou += 1; reasons.push('贵州整体消费更低'); }
      else { scores.guizhou += (q.length % 2); scores.yunnan += ((q.length + 1) % 2); }
    }

    const winner = scores.yunnan >= scores.guizhou ? 'yunnan' : 'guizhou';
    return {
      dest: winner, transport: transportPref || (winner === 'guizhou' ? 'highspeed' : 'highspeed'),
      budget: budgetLevel, reasons: reasons.length > 0 ? reasons : ['根据你的整体偏好分析'],
      destName: DEST_INFO[winner].name, destIcon: DEST_INFO[winner].icon, destEmoji: DEST_INFO[winner].emoji,
    };
  }

  function getAICardText(dest, transport, budgetLevel) {
    const dInfo = DEST_INFO[dest]; const tInfo = TRANSPORT_INFO[transport];
    const plan = PLANS[dest][transport];
    let text = '👉 为你推荐：<b>' + dInfo.icon + ' ' + dInfo.name + '</b> · ' + tInfo.name + '出行\n\n';
    if (budgetLevel === 'eco') {
      text += '🌱 <i>经济实惠方案</i>\n💰 预估：' + plan.eco.total + '\n';
      text += '🏠 ' + plan.eco.budget[1].value + ' | 🎫 ' + plan.eco.budget[2].value + ' | 🍜 ' + plan.eco.budget[3].value;
    } else if (budgetLevel === 'premium') {
      text += '👑 <i>品质享受方案</i>\n💰 预估：' + plan.premium.total + '\n';
      text += '🏨 ' + plan.premium.budget[1].value + ' | 🎫 ' + plan.premium.budget[2].value + ' | 🍽️ ' + plan.premium.budget[3].value;
    } else {
      text += '两种方案：\n🌱 经济实惠：' + plan.eco.total + '\n👑 品质享受：' + plan.premium.total;
    }
    text += '\n\n🏆 推荐景点：';
    plan.attractions.slice(0,3).forEach(function(a){ text += '\n· ' + a.name; });
    return text;
  }

  function addBotMessage(text, quickActions) {
    const msgs = document.getElementById('chatMessages');
    if (!msgs) return;
    let h = '<div class="msg bot"><div>' + text.replace(/\n/g, '<br>') + '</div>';
    if (quickActions && quickActions.length > 0) {
      h += '<div class="quick-actions">';
      quickActions.forEach(function(qa){
        h += '<button class="qa-btn" onclick="sendQuick(\'' + qa.action.replace(/'/g,"\\'") + '\')">' + qa.text + '</button>';
      });
      h += '</div>';
    }
    h += '</div>';
    // Remove typing indicator if present
    const last = msgs.querySelector('.msg.bot:last-child');
    if (last && last.querySelector('.typing-indicator')) last.remove();
    msgs.innerHTML += h;
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addUserMessage(text) {
    const msgs = document.getElementById('chatMessages');
    if (!msgs) return;
    msgs.innerHTML += '<div class="msg user">' + text + '</div>';
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('chatMessages');
    if (!msgs) return;
    msgs.innerHTML += '<div class="msg bot"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
    msgs.scrollTop = msgs.scrollHeight;
  }

  window.sendQuick = function(text) {
    if (text === 'show' && currentRecommendation) {
      const r = currentRecommendation;
      renderResult(r.transport, r.dest);
      closeChat();
      setTimeout(function(){
        const card = document.querySelector('.result-card');
        if (card) card.scrollIntoView({behavior:'smooth',block:'start'});
      }, 200);
      return;
    }
    if (text === '换个其他地方看看') { window.startSpin(); closeChat(); return; }
    if (text === '帮我随机推荐一个') {
      const rd = DESTINATIONS[Math.floor(Math.random() * 2)];
      const rt = TRANSPORTS[Math.floor(Math.random() * 2)];
      currentRecommendation = { dest: rd, transport: rt, budget: null, destName: DEST_INFO[rd].name, destIcon: DEST_INFO[rd].icon, destEmoji: DEST_INFO[rd].emoji };
      addBotMessage('🎲 随机为你推荐：<b>' + DEST_INFO[rd].icon + ' ' + DEST_INFO[rd].name + '</b> · ' + TRANSPORT_INFO[rt].name + '出行！\n\n' + getAICardText(rd, rt, null),
        [{ text: '✅ 查看完整方案', action: 'show' }, { text: '🔄 再随机一次', action: '帮我随机推荐一个' }]);
      document.getElementById('chatInput').value = '';
      document.getElementById('chatInput').focus();
      return;
    }
    if (text === '还有问题想问') {
      addBotMessage('没问题！你还想了解什么？', [
        { text: '🏠 住宿推荐', action: '有什么住宿推荐？' },
        { text: '🍜 美食攻略', action: '当地有什么好吃的？' },
        { text: '🚗 交通细节', action: '到了当地怎么走？' },
      ]);
      document.getElementById('chatInput').value = '';
      document.getElementById('chatInput').focus();
      return;
    }
    if (text.includes('住宿')) {
      addBotMessage('🏠 <b>住宿推荐：</b>\n\n🌱 经济型：青旅/民宿 ¥80-150/晚\n👑 品质型：五星酒店/特色民宿 ¥400-2000/晚\n\n建议提前在携程/美团预订，淡季更便宜！');
      document.getElementById('chatInput').value = '';
      document.getElementById('chatInput').focus();
      return;
    }
    if (text.includes('美食') || text.includes('好吃')) {
      addBotMessage('🍜 <b>美食攻略：</b>\n\n云南必吃：过桥米线、野生菌火锅、大理酸辣鱼、丽江腊排骨\n贵州必吃：酸汤鱼、肠旺面、丝娃娃、花溪牛肉粉、烙锅\n\n推荐去当地人常去的小馆子！');
      document.getElementById('chatInput').value = '';
      document.getElementById('chatInput').focus();
      return;
    }
    if (text.includes('交通') || text.includes('怎么走')) {
      addBotMessage('🚗 <b>当地交通：</b>\n\n高铁沿线：主要城市间有动车/高铁\n城内：公交+地铁+共享单车\n景点：部分需要拼车或包车\n\n推荐下载高德地图查实时路线');
      document.getElementById('chatInput').value = '';
      document.getElementById('chatInput').focus();
      return;
    }

    // Default: pass as input
    document.getElementById('chatInput').value = text;
    sendMessage();
  };

  window.sendMessage = function() {
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = '';
    btn.disabled = true;
    showTyping();

    const result = analyzeIntent(text);
    currentRecommendation = result;

    setTimeout(function(){
      const dInfo = DEST_INFO[result.dest];
      const tInfo = TRANSPORT_INFO[result.transport];
      const reasonText = result.reasons.map(function(r){ return '· ' + r; }).join('\n');
      const aiText = getAICardText(result.dest, result.transport, result.budget);

      let msg = '🔍 ' + reasonText + '\n\n' + aiText;
      let actions = [
        { text: '✅ 查看完整方案', action: 'show' },
        { text: '💬 还有疑问…', action: '还有问题想问' },
      ];

      // Determine which budget tab to show
      currentRecommendation.budget = result.budget;
      addBotMessage(msg, actions);
      btn.disabled = false;
      input.focus();
    }, 1000 + Math.random() * 600);
  };

  // ===== SPIN & RENDER =====
  let isSpinning = false;
  const spinBtn = document.getElementById('spinBtn');
  const resultArea = document.getElementById('resultArea');
  const slotTransport = document.getElementById('slotTransport');
  const slotDest = document.getElementById('slotDest');
  const confettiRoot = document.getElementById('confettiRoot');

  const TE = { highspeed: '🚄', flight: '✈️' };
  const TN = { highspeed: '高铁', flight: '飞机' };
  const DE = { yunnan: '🏔️', guizhou: '⛰️' };
  const DN = { yunnan: '云南', guizhou: '贵州' };

  window.startSpin = function() {
    if (isSpinning) return;
    isSpinning = true; spinBtn.disabled = true; spinBtn.classList.add('spinning');
    const finalTransport = TRANSPORTS[Math.floor(Math.random() * 2)];
    const finalDest = DESTINATIONS[Math.floor(Math.random() * 2)];
    slotTransport.classList.add('shaking'); slotDest.classList.add('shaking');
    let tick = 0; const maxTicks = 16;
    const interval = setInterval(function() {
      const t = Math.floor(Math.random() * 2); const d = Math.floor(Math.random() * 2);
      slotTransport.querySelector('.slot-emoji').textContent = TE[TRANSPORTS[t]];
      slotTransport.querySelector('.slot-value').textContent = TN[TRANSPORTS[t]];
      slotDest.querySelector('.slot-emoji').textContent = DE[DESTINATIONS[d]];
      slotDest.querySelector('.slot-value').textContent = DN[DESTINATIONS[d]];
      tick++;
      if (tick >= maxTicks) {
        clearInterval(interval);
        slotTransport.querySelector('.slot-emoji').textContent = TE[finalTransport];
        slotTransport.querySelector('.slot-value').textContent = TN[finalTransport];
        slotDest.querySelector('.slot-emoji').textContent = DE[finalDest];
        slotDest.querySelector('.slot-value').textContent = DN[finalDest];
        slotTransport.classList.remove('shaking'); slotDest.classList.remove('shaking');
        renderResult(finalTransport, finalDest); launchConfetti();
        isSpinning = false; spinBtn.disabled = false; spinBtn.classList.remove('spinning');
      }
    }, 70);
  };

  function renderResult(transport, dest) {
    const tInfo = TRANSPORT_INFO[transport]; const dInfo = DEST_INFO[dest];
    const plan = PLANS[dest][transport];
    const seasonTag = dest==='yunnan' ? '3-5月/9-11月' : '4-6月/9-10月';
    let h = '<div class="result-card '+dInfo.css+'">';
    h += '<div class="result-banner '+dInfo.bg+'">';
    h += '<span class="rb-icon">'+dInfo.icon+'</span><div class="rb-info">';
    h += '<h2>'+dInfo.name+' · '+tInfo.name+'出行</h2>';
    h += '<div class="rb-tags"><span class="rb-tag">'+tInfo.icon+' '+tInfo.name+'出发</span>';
    h += '<span class="rb-tag">'+dInfo.emoji+' 5天4晚</span>';
    h += '<span class="rb-tag">📅 '+seasonTag+'</span></div></div></div>';
    h += '<div class="result-body">';
    h += '<div class="section-title">🏆 '+tInfo.name+'出行 · 精选景点</div>';
    h += '<div class="attr-grid">';
    plan.attractions.forEach(function(a,i){
      let rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
      h += '<div class="attr-item"><div class="attr-rank '+rc+'">'+(i+1)+'</div>';
      h += '<div class="attr-name">'+a.name+'</div><div class="attr-desc">'+a.desc+'</div>';
      h += '<div class="attr-tags">'; a.tags.forEach(function(t){h+='<span>'+t+'</span>';}); h += '</div></div>';
    });
    h += '</div>';
    h += '<div class="tab-switcher">';
    h += '<button class="tab-btn eco-tab active" onclick="switchTab(\'eco\',this)">🌱 经济实惠</button>';
    h += '<button class="tab-btn premium-tab" onclick="switchTab(\'premium\',this)">👑 品质享受</button></div>';

    ['eco','premium'].forEach(function(type){
      let cls = type==='eco'?'':' style="display:none"';
      h += '<div class="tab-content'+(type==='eco'?' active':'')+'" id="tab-'+type+'"'+cls+'>';
      h += '<div class="section-title">🗓️ '+(type==='eco'?'经济实惠':'品质享受')+'路线</div>';
      h += '<div class="itinerary">';
      plan[type].itinerary.forEach(function(d,i){
        h += '<div class="it-day"><div class="it-day-num">D'+(i+1)+'</div>';
        h += '<div class="it-day-content"><h5>'+d.title+'</h5><p>'+d.desc+'</p></div></div>';
      });
      h += '</div>';
      let bpCls = type==='eco' ? 'eco-plan' : 'premium-plan';
      let hdrCls = type==='eco' ? 'eco' : 'premium';
      h += '<div class="budget-plan '+bpCls+'">';
      h += '<div class="budget-plan-header '+hdrCls+'">'+(type==='eco'?'🌱':'👑')+' '+(type==='eco'?'经济实惠':'品质享受')+' · 预算明细</div>';
      h += '<div class="budget-plan-body">';
      plan[type].budget.forEach(function(b){
        h += '<div class="budget-row"><span class="br-label">'+b.label+'</span>';
        h += '<div><div class="br-value">'+b.value+'</div><div class="br-detail">'+b.detail+'</div></div></div>';
      });
      h += '</div><div class="budget-plan-total">'+plan[type].total+'</div></div>';
      h += '</div>';
    });

    h += '<div class="comparison-bar"><span class="cb-icon">💡</span>';
    h += '<span class="cb-text"><b>差价约 ¥'+(plan.premium.totalNum - plan.eco.totalNum).toLocaleString()+'/人</b> —— 经济方案省下的钱可以再玩一趟！品质方案多花的钱换来VIP通道、高端住宿和更深度体验。</span></div>';
    h += '</div></div>';
    resultArea.innerHTML = h;
    if (window.innerWidth < 768) {
      setTimeout(function(){
        const card = document.querySelector('.result-card');
        if (card) card.scrollIntoView({behavior:'smooth',block:'start'});
      }, 100);
    }
  }

  window.switchTab = function(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById('tab-'+tab).classList.add('active'); btn.classList.add('active');
  };

  function launchConfetti() {
    const frag = document.createDocumentFragment();
    const cols = ['#e8633a','#2d8a6e','#f5a623','#6a9bcc','#e06090','#9b59b6','#f39c12','#1abc9c'];
    for (let i=0;i<50;i++) {
      const p = document.createElement('div'); p.className='c-piece';
      p.style.left=Math.random()*100+'%'; p.style.top=-(Math.random()*20)+'px';
      p.style.backgroundColor=cols[Math.floor(Math.random()*cols.length)];
      p.style.animationDelay=Math.random()*0.6+'s';
      p.style.animationDuration=(Math.random()*2+2.2)+'s';
      p.style.width=(Math.random()*8+5)+'px'; p.style.height=(Math.random()*8+5)+'px';
      frag.appendChild(p);
    }
    confettiRoot.innerHTML=''; confettiRoot.appendChild(frag);
    setTimeout(function(){confettiRoot.innerHTML='';},3500);
  }
})();
</script></body></html>
