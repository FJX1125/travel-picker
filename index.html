<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云南 VS 贵州 - 旅游随机选择器</title>
<style>
:root {
  --yn-primary: #e8633a;
  --yn-light: #fdf2ed;
  --yn-accent: #c44a28;
  --gz-primary: #2d8a6e;
  --gz-light: #edf7f2;
  --gz-accent: #1a6b52;
  --bg: #f8f7f4;
  --card: #ffffff;
  --text: #2d2d2d;
  --text-sub: #6b6b6b;
  --border: #e8e6dc;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --radius: 24px;
  --radius-sm: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 60px;
  -webkit-font-smoothing: antialiased;
}

.header {
  text-align: center;
  margin-bottom: 32px;
}
.header h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--yn-primary), var(--gz-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p {
  color: var(--text-sub);
  font-size: 0.95rem;
  margin-top: 6px;
}

/* ---- Transport Selector ---- */
.transport-section {
  display: flex;
  gap: 8px;
  background: var(--card);
  border-radius: 48px;
  padding: 5px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 32px;
  border: 1px solid var(--border);
}
.transport-btn {
  padding: 10px 24px;
  border-radius: 44px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  background: transparent;
  color: var(--text-sub);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}
.transport-btn.active {
  background: var(--text);
  color: #fff;
  box-shadow: var(--shadow-md);
}
.transport-btn:hover:not(.active) {
  background: rgba(0,0,0,0.04);
}

/* ---- Main Picker Section ---- */
.picker-container {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 780px;
  width: 100%;
  margin-bottom: 36px;
  perspective: 1200px;
}

.dest-card {
  flex: 1 1 280px;
  max-width: 360px;
  min-width: 260px;
  border-radius: var(--radius);
  padding: 32px 24px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
  border: 2px solid transparent;
}
.dest-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.06;
  transition: opacity 0.3s;
}
.dest-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
}
.dest-card:hover::before { opacity: 0.1; }

.dest-card.yn {
  background: var(--card);
  border-color: var(--yn-primary);
}
.dest-card.yn::before {
  background: var(--yn-primary);
}
.dest-card.gz {
  background: var(--card);
  border-color: var(--gz-primary);
}
.dest-card.gz::before {
  background: var(--gz-primary);
}

.dest-emoji {
  font-size: 4rem;
  margin-bottom: 12px;
  display: block;
}
.dest-name {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.dest-card.yn .dest-name { color: var(--yn-primary); }
.dest-card.gz .dest-name { color: var(--gz-primary); }
.dest-subtitle {
  font-size: 0.9rem;
  color: var(--text-sub);
  line-height: 1.5;
}

/* ---- Slot Machine Animation ---- */
@keyframes slotBlur {
  0%   { filter: blur(0px); transform: translateY(0); }
  15%  { filter: blur(2px); transform: translateY(-8px); }
  30%  { filter: blur(4px); transform: translateY(8px); }
  45%  { filter: blur(2px); transform: translateY(-4px); }
  60%  { filter: blur(0px); transform: translateY(4px); }
  75%  { filter: blur(1px); transform: translateY(-2px); }
  100% { filter: blur(0px); transform: translateY(0); }
}

@keyframes slotSpin {
  0%   { transform: scale(1); }
  20%  { transform: scale(1.08); }
  40%  { transform: scale(0.92); }
  55%  { transform: scale(1.04); }
  70%  { transform: scale(0.96); }
  85%  { transform: scale(1.01); }
  100% { transform: scale(1); }
}

.spinning {
  animation: slotSpin 0.9s ease-out, slotBlur 0.7s ease-in-out;
}

/* ---- Spin Button ---- */
.spin-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 40px;
  border-radius: 48px;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #ff6b4a, #e8633a);
  box-shadow: 0 4px 20px rgba(232,99,58,0.35);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  margin-bottom: 36px;
  letter-spacing: 0.02em;
}
.spin-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(232,99,58,0.45);
}
.spin-btn:active {
  transform: scale(0.96);
}
.spin-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.spin-icon {
  font-size: 1.4rem;
  display: inline-block;
  transition: transform 0.5s;
}
.spinning .spin-icon {
  animation: spin3d 0.9s ease-out;
}
@keyframes spin3d {
  0%   { transform: rotateY(0deg); }
  100% { transform: rotateY(720deg); }
}

/* ---- Result Display ---- */
.result-section {
  width: 100%;
  max-width: 780px;
}

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 28px 32px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
  border: 1px solid var(--border);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.result-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}
.result-header .icon {
  font-size: 2.8rem;
}
.result-header .info h2 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.result-header .info .transport-tag {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 20px;
  margin-top: 4px;
}
.result-card.selected-yn .transport-tag {
  background: var(--yn-light);
  color: var(--yn-accent);
}
.result-card.selected-gz .transport-tag {
  background: var(--gz-light);
  color: var(--gz-accent);
}
.result-card.selected-yn h2 { color: var(--yn-primary); }
.result-card.selected-gz h2 { color: var(--gz-primary); }

.section-title {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-sub);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}

/* ---- Attraction Grid ---- */
.attraction-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

.attraction-item {
  background: #fafaf8;
  border-radius: var(--radius-sm);
  padding: 16px;
  border: 1px solid var(--border);
  transition: all 0.25s;
  cursor: default;
}
.attraction-item:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
  border-color: #d0cec6;
}
.attraction-rank {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 0.75rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 8px;
}
.attraction-rank.top1 { background: linear-gradient(135deg, #f5a623, #e8961a); }
.attraction-rank.top2 { background: linear-gradient(135deg, #a0a0a0, #808080); }
.attraction-rank.top3 { background: linear-gradient(135deg, #c8945c, #a87840); }
.attraction-rank.normal { background: #ccc; }

.attraction-name {
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 4px;
}
.attraction-desc {
  font-size: 0.8rem;
  color: var(--text-sub);
  line-height: 1.4;
}
.attraction-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}
.attraction-tags span {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
}
.selected-yn .attraction-tags span {
  background: var(--yn-light);
  color: var(--yn-accent);
}
.selected-gz .attraction-tags span {
  background: var(--gz-light);
  color: var(--gz-accent);
}

/* ---- Stats Row ---- */
.stats-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.stat-item {
  flex: 1;
  min-width: 80px;
  text-align: center;
}
.stat-value {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.stat-label {
  font-size: 0.75rem;
  color: var(--text-sub);
  margin-top: 2px;
}
.selected-yn .stat-value { color: var(--yn-primary); }
.selected-gz .stat-value { color: var(--gz-primary); }

/* ---- Transport Info ---- */
.transport-info {
  background: linear-gradient(135deg, #fdfcf9, #f7f6f1);
  border-radius: var(--radius-sm);
  padding: 18px 20px;
  margin: 20px 0;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
}
.transport-info .ti-icon {
  font-size: 2rem;
}
.transport-info .ti-details h4 {
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 2px;
}
.transport-info .ti-details p {
  font-size: 0.8rem;
  color: var(--text-sub);
}

/* ---- Placeholder / Empty State ---- */
.placeholder-section {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-sub);
}
.placeholder-section .ph-icon {
  font-size: 4rem;
  opacity: 0.3;
  margin-bottom: 16px;
}
.placeholder-section h3 {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.placeholder-section p {
  font-size: 0.9rem;
}

/* ---- Animations ---- */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in-up {
  animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.fade-in-up:nth-child(1) { animation-delay: 0.05s; }
.fade-in-up:nth-child(2) { animation-delay: 0.1s; }
.fade-in-up:nth-child(3) { animation-delay: 0.15s; }
.fade-in-up:nth-child(4) { animation-delay: 0.2s; }
.fade-in-up:nth-child(5) { animation-delay: 0.25s; }
.fade-in-up:nth-child(6) { animation-delay: 0.3s; }
.fade-in-up:nth-child(7) { animation-delay: 0.35s; }
.fade-in-up:nth-child(8) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.result-card.selected-yn { border-left: 4px solid var(--yn-primary); }
.result-card.selected-gz { border-left: 4px solid var(--gz-primary); }

/* ---- Glow on winner ---- */
.dest-card.winner {
  transform: scale(1.03);
  z-index: 2;
}
.dest-card.winner.yn {
  box-shadow: 0 0 0 4px rgba(232,99,58,0.3), var(--shadow-lg);
  border-color: var(--yn-accent);
}
.dest-card.winner.gz {
  box-shadow: 0 0 0 4px rgba(45,138,110,0.3), var(--shadow-lg);
  border-color: var(--gz-accent);
}

/* ---- Confetti ---- */
.confetti-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall 2.5s ease-out forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ---- Responsive ---- */
@media (max-width: 640px) {
  .dest-card { flex: 1 1 100%; max-width: 100%; }
  .attraction-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .header h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>下一站去哪儿？</h1>
  <p>云南 vs 贵州 &middot; 大数据帮你选</p>
</div>

<!-- Transport Selector -->
<div class="transport-section" id="transportSection">
  <button class="transport-btn active" data-transport="highspeed">高铁出行</button>
  <button class="transport-btn" data-transport="flight">飞机出行</button>
</div>

<!-- Destination Picker -->
<div class="picker-container" id="pickerContainer">
  <div class="dest-card yn" data-dest="yunnan" id="cardYN">
    <span class="dest-emoji">🏔️</span>
    <div class="dest-name">云南</div>
    <div class="dest-subtitle">彩云之南，风花雪月<br>丽江古城 · 玉龙雪山 · 洱海</div>
  </div>
  <div class="dest-card gz" data-dest="guizhou" id="cardGZ">
    <span class="dest-emoji">⛰️</span>
    <div class="dest-name">贵州</div>
    <div class="dest-subtitle">多彩贵州，山水秘境<br>黄果树瀑布 · 千户苗寨 · 梵净山</div>
  </div>
</div>

<!-- Spin Button -->
<button class="spin-btn" id="spinBtn">
  <span class="spin-icon">🎲</span> 开始随机选择
</button>

<!-- Result Area -->
<div class="result-section" id="resultSection">
  <div class="placeholder-section" id="placeholderState">
    <div class="ph-icon">🎯</div>
    <h3>点击上方按钮，让命运做决定</h3>
    <p>或者直接点击卡片选择你的目的地</p>
  </div>
</div>

<div id="confettiRoot"></div>


<script>
(function() {
  'use strict';

  // ---- DATA: Big data tourist attractions ----
  const ATTRACTIONS = {
    yunnan: [
      { name: '丽江古城', desc: '世界文化遗产，800年历史的水乡古城，纳西族文化发源地。', tags: ['古镇', '世界遗产', '人文'], stats: '年均游客 5400万+' },
      { name: '玉龙雪山', desc: '北半球最近赤道的雪山，13座雪峰连绵，海拔5596米。', tags: ['雪山', '自然奇观', '登山'], stats: '好评率 96%' },
      { name: '大理洱海', desc: '高原明珠，形如人耳，环湖120公里，风花雪月四景之首。', tags: ['湖泊', '骑行', '摄影'], stats: '4.8分/5' },
      { name: '香格里拉普达措', desc: '中国第一个国家公园，高山湖泊与草甸交织的世外桃源。', tags: ['国家公园', '高原', '生态'], stats: '含氧量Top' },
      { name: '西双版纳热带雨林', desc: '中国唯一热带雨林自然保护区，野象谷邂逅亚洲象。', tags: ['雨林', '民族风情', '动物'], stats: '物种 5000+' },
      { name: '泸沽湖', desc: '摩梭人"走婚"文化的母系社会遗存，湖水能见度12米。', tags: ['湖泊', '民俗', '秘境'], stats: '透明度 12m' },
      { name: '石林风景区', desc: '世界自然遗产，2.7亿年喀斯特地貌奇观，"天下第一奇观"。', tags: ['地质奇观', '世界遗产', '自然'], stats: '面积 400km²' },
      { name: '元阳梯田', desc: '哈尼族1300年农耕杰作，世界文化遗产，光影魔幻天堂。', tags: ['梯田', '世界遗产', '摄影'], stats: '落差 1300m' },
    ],
    guizhou: [
      { name: '黄果树瀑布', desc: '亚洲第一大瀑布，高77.8米宽101米，水帘洞穿越体验。', tags: ['瀑布', '自然奇观', '地标'], stats: '年均游客 3000万+' },
      { name: '西江千户苗寨', desc: '世界最大苗寨，1400余户苗族聚居，万家灯火夜景震撼。', tags: ['苗寨', '民俗', '夜景'], stats: '户数 1432' },
      { name: '梵净山', desc: '世界自然遗产，红云金顶直插云霄，佛光与云海奇观。', tags: ['世界遗产', '佛教名山', '云海'], stats: '海拔 2572m' },
      { name: '荔波小七孔', desc: '"地球腰带上的绿宝石"，水上森林与68级跌水瀑布。', tags: ['喀斯特', '水上森林', '世界遗产'], stats: '含氧量极高' },
      { name: '镇远古镇', desc: '2200年历史，舞阳河S形穿城，太极古镇，夜游如画。', tags: ['古镇', '历史', '夜景'], stats: '五星景点' },
      { name: '织金洞', desc: '"溶洞之王"，中国最美六大旅游洞穴之首，洞内奇石万千。', tags: ['溶洞', '地质奇观', '自然'], stats: '长度 12.1km' },
      { name: '加榜梯田', desc: '苗族人世代耕种，云雾中梯田如链似带，摄影家天堂。', tags: ['梯田', '摄影', '民俗'], stats: '4.9分/5' },
      { name: '赤水丹霞', desc: '世界自然遗产，红色砂岩与瀑布群交相辉映，壮美如画。', tags: ['丹霞', '世界遗产', '瀑布'], stats: '面积 1200km²' },
    ]
  };

  // ---- Transport Info ----
  const TRANSPORT_INFO = {
    highspeed: {
      icon: '🚄',
      label: '高铁出行',
      yunnan: { time: '约 7-10 小时（昆明）', cost: '二等座约 ¥600-900', tip: '沪昆高铁直达，沿途风景壮美' },
      guizhou: { time: '约 5-8 小时（贵阳）', cost: '二等座约 ¥400-700', tip: '沪昆/贵广高铁覆盖，性价比极高' },
    },
    flight: {
      icon: '✈️',
      label: '飞机出行',
      yunnan: { time: '约 2.5-3.5 小时', cost: '经济舱约 ¥800-1500', tip: '昆明长水机场，航班密集' },
      guizhou: { time: '约 2-3 小时', cost: '经济舱约 ¥600-1200', tip: '贵阳龙洞堡机场，淡季折扣大' },
    }
  };

  // ---- State ----
  let selectedTransport = 'highspeed';
  let selectedDest = null;
  let isSpinning = false;

  // ---- DOM ----
  const spinBtn = document.getElementById('spinBtn');
  const cardYN = document.getElementById('cardYN');
  const cardGZ = document.getElementById('cardGZ');
  const resultSection = document.getElementById('resultSection');
  const transportSection = document.getElementById('transportSection');
  const confettiRoot = document.getElementById('confettiRoot');

  // ---- Transport Selection ----
  transportSection.addEventListener('click', function(e) {
    const btn = e.target.closest('.transport-btn');
    if (!btn) return;
    document.querySelectorAll('.transport-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTransport = btn.dataset.transport;
    if (selectedDest) {
      renderResult(selectedDest);
    }
  });

  // ---- Click Card to Select ----
  cardYN.addEventListener('click', function() { selectDestination('yunnan'); });
  cardGZ.addEventListener('click', function() { selectDestination('guizhou'); });

  // ---- Random Spin ----
  spinBtn.addEventListener('click', function() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add('spinning');

    // Add spinning class to both cards
    cardYN.classList.add('spinning');
    cardGZ.classList.add('spinning');

    // Random toggle during spin
    let toggleCount = 0;
    const maxToggles = 12;
    const spinInterval = setInterval(function() {
      cardYN.classList.toggle('winner');
      cardGZ.classList.toggle('winner');
      toggleCount++;
      if (toggleCount >= maxToggles) {
        clearInterval(spinInterval);
        // Final pick
        const rand = Math.random();
        const dest = rand < 0.5 ? 'yunnan' : 'guizhou';
        finishSpin(dest);
      }
    }, 80);
  });

  function finishSpin(dest) {
    cardYN.classList.remove('spinning', 'winner');
    cardGZ.classList.remove('spinning', 'winner');
    selectDestination(dest);
    isSpinning = false;
    spinBtn.disabled = false;
    spinBtn.classList.remove('spinning');
    launchConfetti();
  }

  // ---- Select & Render ----
  function selectDestination(dest) {
    selectedDest = dest;
    // Highlight winner
    cardYN.classList.remove('winner');
    cardGZ.classList.remove('winner');
    if (dest === 'yunnan') cardYN.classList.add('winner');
    else cardGZ.classList.add('winner');

    // Remove winner after delay
    setTimeout(function() {
      cardYN.classList.remove('winner');
      cardGZ.classList.remove('winner');
    }, 2000);

    renderResult(dest);

    // Scroll to result on mobile
    if (window.innerWidth < 768) {
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function renderResult(dest) {
    const transport = TRANSPORT_INFO[selectedTransport];
    const tInfo = transport[dest];
    const attrs = ATTRACTIONS[dest];
    const destName = dest === 'yunnan' ? '云南' : '贵州';
    const destIcon = dest === 'yunnan' ? '🏔️' : '⛰️';
    const cardClass = dest === 'yunnan' ? 'selected-yn' : 'selected-gz';

    let html = '<div class="result-card ' + cardClass + ' fade-in-up">';

    // Header
    html += '<div class="result-header">';
    html += '<span class="icon">' + destIcon + '</span>';
    html += '<div class="info">';
    html += '<h2>' + destName + ' &middot; 大数据推荐</h2>';
    html += '<span class="transport-tag">' + transport.icon + ' ' + transport.label + '</span>';
    html += '</div></div>';

    // Transport Info
    html += '<div class="transport-info">';
    html += '<span class="ti-icon">' + transport.icon + '</span>';
    html += '<div class="ti-details">';
    html += '<h4>' + transport.label + '：' + tInfo.time + '</h4>';
    html += '<p>' + tInfo.cost + ' &middot; ' + tInfo.tip + '</p>';
    html += '</div></div>';

    // Attractions
    html += '<div class="section-title">热门景点排行（基于搜索热度 &middot; 好评率 &middot; 社交媒体提及量）</div>';
    html += '<div class="attraction-grid">';

    attrs.forEach(function(attr, i) {
      let rankClass = 'normal';
      if (i === 0) rankClass = 'top1';
      else if (i === 1) rankClass = 'top2';
      else if (i === 2) rankClass = 'top3';

      html += '<div class="attraction-item fade-in-up">';
      html += '<div class="attraction-rank ' + rankClass + '">' + (i + 1) + '</div>';
      html += '<div class="attraction-name">' + attr.name + '</div>';
      html += '<div class="attraction-desc">' + attr.desc + '</div>';
      html += '<div class="attraction-tags">';
      attr.tags.forEach(function(t) {
        html += '<span>' + t + '</span>';
      });
      html += '</div></div>';
    });

    html += '</div>';

    // Stats Row
    html += '<div class="stats-row">';
    html += '<div class="stat-item"><div class="stat-value">' + attrs.length + '+</div><div class="stat-label">热门景点</div></div>';
    html += '<div class="stat-item"><div class="stat-value">4.7</div><div class="stat-label">综合评分/5</div></div>';
    html += '<div class="stat-item"><div class="stat-value">' + (dest === 'yunnan' ? '1.2亿' : '8400万') + '</div><div class="stat-label">年均游客</div></div>';
    html += '<div class="stat-item"><div class="stat-value">' + (dest === 'yunnan' ? '16' : '9') + '</div><div class="stat-label">5A级景区</div></div>';
    html += '</div>';

    html += '</div>';

    resultSection.innerHTML = html;
  }

  // ---- Confetti ----
  function launchConfetti() {
    var frag = document.createDocumentFragment();
    var colors = ['#e8633a', '#2d8a6e', '#f5a623', '#6a9bcc', '#e06090', '#9b59b6', '#f39c12', '#1abc9c'];
    for (var i = 0; i < 60; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.top = -(Math.random() * 20) + 'px';
      piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = Math.random() * 0.8 + 's';
      piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
      piece.style.width = (Math.random() * 8 + 6) + 'px';
      piece.style.height = (Math.random() * 8 + 6) + 'px';
      frag.appendChild(piece);
    }
    confettiRoot.innerHTML = '';
    confettiRoot.appendChild(frag);
    setTimeout(function() {
      confettiRoot.innerHTML = '';
    }, 3500);
  }

})();
</script>
</body>
</html>
